<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Youssef Gamal - Software Engineer. Pipeline: scrape, automate, Laravel, AI" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0e17"/>
      <stop offset="1" stop-color="#141a2c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="18" fill="none" stroke="#2a3150"/>

  <!-- status pill -->
  <g font-family="Consolas, 'Courier New', monospace" font-size="14">
    <rect x="936" y="30" width="230" height="30" rx="15" fill="#0f1524" stroke="#2a3150"/>
    <circle cx="958" cy="45" r="5" fill="#27c93f">
      <animate attributeName="opacity" values="1;0.25;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="972" y="50" fill="#9aa4c7">online since 2020</text>
  </g>

  <!-- title -->
  <text x="60" y="98" font-family="'Segoe UI', Arial, sans-serif" font-size="54" font-weight="700" fill="url(#accent)">Youssef Gamal</text>
  <text x="62" y="136" font-family="Consolas, 'Courier New', monospace" font-size="20" fill="#9aa4c7">software engineer  /  I build systems that run on their own</text>

  <!-- pipeline paths -->
  <g fill="none" stroke="#3a4468" stroke-width="2" stroke-dasharray="6 6">
    <path id="p1" d="M270 243 L360 243"><animate attributeName="stroke-dashoffset" from="24" to="0" dur="1.2s" repeatCount="indefinite"/></path>
    <path id="p2" d="M570 243 L660 243"><animate attributeName="stroke-dashoffset" from="24" to="0" dur="1.2s" repeatCount="indefinite"/></path>
    <path id="p3" d="M870 243 L960 243"><animate attributeName="stroke-dashoffset" from="24" to="0" dur="1.2s" repeatCount="indefinite"/></path>
  </g>

  <!-- nodes -->
  <g font-family="Consolas, 'Courier New', monospace" text-anchor="middle">
    <g>
      <rect x="60" y="205" width="210" height="76" rx="12" fill="#0f1524" stroke="#22d3ee" stroke-opacity="0.7"/>
      <text x="165" y="238" font-size="22" font-weight="700" fill="#e6e9f5">scrape</text>
      <text x="165" y="263" font-size="14" fill="#6b7597">2020 · where it started</text>
    </g>
    <g>
      <rect x="360" y="205" width="210" height="76" rx="12" fill="#0f1524" stroke="#4fb8f0" stroke-opacity="0.7"/>
      <text x="465" y="238" font-size="22" font-weight="700" fill="#e6e9f5">automate</text>
      <text x="465" y="263" font-size="14" fill="#6b7597">scripts that repeat for me</text>
    </g>
    <g>
      <rect x="660" y="205" width="210" height="76" rx="12" fill="#0f1524" stroke="#8b9cf5" stroke-opacity="0.7"/>
      <text x="765" y="238" font-size="22" font-weight="700" fill="#e6e9f5">laravel</text>
      <text x="765" y="263" font-size="14" fill="#6b7597">full-stack systems</text>
    </g>
    <g>
      <rect x="960" y="205" width="210" height="76" rx="12" fill="#a78bfa" fill-opacity="0.12" stroke="#a78bfa"/>
      <rect x="960" y="205" width="210" height="76" rx="12" fill="#a78bfa" opacity="0.25" filter="url(#blur)">
        <animate attributeName="opacity" values="0.1;0.35;0.1" dur="2.4s" repeatCount="indefinite"/>
      </rect>
      <text x="1065" y="238" font-size="22" font-weight="700" fill="#ffffff">backend + AI</text>
      <text x="1065" y="263" font-size="14" fill="#b9a8f5">what I build now</text>
    </g>
  </g>

  <!-- data packets -->
  <g fill="#22d3ee">
    <circle r="5"><animateMotion dur="1.6s" repeatCount="indefinite" begin="0s"><mpath href="#p1"/></animateMotion></circle>
    <circle r="5" fill="#4fb8f0"><animateMotion dur="1.6s" repeatCount="indefinite" begin="0.53s"><mpath href="#p2"/></animateMotion></circle>
    <circle r="5" fill="#a78bfa"><animateMotion dur="1.6s" repeatCount="indefinite" begin="1.06s"><mpath href="#p3"/></animateMotion></circle>
  </g>
</svg>
