<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Youssef Gamal - Software Engineer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f19"/>
      <stop offset="1" stop-color="#161b2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="18" fill="none" stroke="#2a3150"/>

  <!-- window dots -->
  <circle cx="34" cy="32" r="7" fill="#ff5f56"/>
  <circle cx="58" cy="32" r="7" fill="#ffbd2e"/>
  <circle cx="82" cy="32" r="7" fill="#27c93f"/>
  <text x="110" y="37" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#5b6484">youssef@dev: ~</text>

  <g font-family="Consolas, 'Courier New', monospace" font-size="24">
    <!-- line 1 -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0.4s" dur="0.4s" fill="freeze"/>
      <text x="48" y="100" fill="#22d3ee">$</text>
      <text x="76" y="100" fill="#e6e9f5">whoami</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="1.2s" dur="0.4s" fill="freeze"/>
      <text x="48" y="150" font-size="52" font-weight="700" fill="url(#accent)">Youssef Gamal</text>
    </g>

    <!-- line 2 -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="2.2s" dur="0.4s" fill="freeze"/>
      <text x="48" y="205" fill="#22d3ee">$</text>
      <text x="76" y="205" fill="#e6e9f5">cat ./focus.txt</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="3s" dur="0.4s" fill="freeze"/>
      <text x="48" y="245" fill="#9aa4c7">backend  ·  automation  ·  AI  ·  embedded</text>
    </g>

    <!-- line 3 -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="3.8s" dur="0.4s" fill="freeze"/>
      <text x="48" y="290" fill="#22d3ee">$</text>
      <rect x="76" y="270" width="14" height="26" fill="#a78bfa">
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- decorative brackets -->
  <text x="1040" y="230" font-family="Consolas, 'Courier New', monospace" font-size="190" font-weight="700" fill="#ffffff" opacity="0.05">{ }</text>
</svg>
